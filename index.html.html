    const c2=document.getElementById("an-center");
    if(c2){
      const byCenter={}; all.forEach(b=>{ (byCenter[b.center.split(",")[0]]=byCenter[b.center.split(",")[0]]||[]).push(b.metrics.qualityScore); });
      const labels=Object.keys(byCenter); const vals=labels.map(l=>Math.round(byCenter[l].reduce((a,b)=>a+b,0)/byCenter[l].length));
      drawChart(c2,{type:"bar",data:{labels,datasets:[{data:vals,backgroundColor:"#2F5233",borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100,grid:{color:"#EAE8DC"}},x:{grid:{display:false},ticks:{font:{size:10}}}}}});
    }
  };
  const totalBatches=all.length;
  const avgA=Math.round(all.reduce((a,b)=>a+b.metrics.gradeAPct,0)/all.length);
  const avgU=Math.round(all.reduce((a,b)=>a+b.metrics.ursPct,0)/all.length);

  const defectTotals={}; DEFECTS.forEach(d=>defectTotals[d]=0);
  all.forEach(b=>b.onions.forEach(o=>defectTotals[o.cls]++));
  const commonDefect = Object.entries(defectTotals).filter(([k])=>k!=="Healthy").sort((a,b)=>b[1]-a[1])[0];

  return `

  </div>

}

function attachViewEvents(){

  const nc=document.getElementById("notif-close"); if(nc) nc.onclick=()=>{S.notifOpen=false;render();};
  const pc=document.getElementById("profile-close"); if(pc) pc.onclick=()=>{S.profileOpen=false;render();};
  document.querySelectorAll("[data-voice]").forEach(b=>b.onclick=()=>runVoiceCommand(b.dataset.voice));
  const logoutBtn=document.getElementById("logout-btn"); if(logoutBtn) logoutBtn.onclick=doLogout;
  const settingsLogout=document.getElementById("settings-logout"); if(settingsLogout) settingsLogout.onclick=doLogout;
  document.querySelectorAll("[data-nav-close]").forEach(b=>b.onclick=()=>{ S.view=b.dataset.navClose; S.profileOpen=false; render(); });
  document.querySelectorAll("[data-nav-to]").forEach(b=>b.onclick=()=>{ S.view=b.dataset.navTo; if(b.dataset.reportBatch) S._reportBatchId=b.dataset.reportBatch; render(); });
  document.querySelectorAll("[data-open-passport]").forEach(b=>b.onclick=()=>{ S._reportBatchId=b.dataset.openPassport; S.view="passport"; render(); });
  document.querySelectorAll("[data-open-verify]").forEach(b=>b.onclick=()=>{ S._verifyBatchId=b.dataset.openVerify; S.view="verify"; render(); });

  // dashboard
  document.querySelectorAll("[data-open-batch]").forEach(b=>b.onclick=()=>{ S._reportBatchId=b.dataset.openBatch; S.view="report_view"; render(); });
  document.querySelectorAll("[data-action='start-new']").forEach(b=>b.onclick=()=>{ startNewWizard(); S.view="wizard"; render(); });

  // wizard-level
  document.querySelectorAll("[data-action='wiz-back']").forEach(back=>back.onclick=()=>{ if(S.wizard.step>0){S.wizard.step--; S.wizard.selectedOnionId=null; render();} });
  document.querySelectorAll("[data-action='wiz-next']").forEach(next=>next.onclick=()=>{ wizardAdvance(); });
  const exitW=document.querySelector("[data-action='exit-wizard']"); if(exitW) exitW.onclick=()=>{ if(confirm("Exit without saving this assessment?")){ S.view="dashboard"; render(); } };
  const saveDraft=document.querySelector("[data-action='save-draft']"); if(saveDraft) saveDraft.onclick=()=>toast("Draft saved locally","success");

  // batch form fields
  ["f-center","f-supplier","f-variety","f-qty","f-notes"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.onchange=()=>{ const map={"f-center":"center","f-supplier":"supplier","f-variety":"variety","f-qty":"qty","f-notes":"notes"}; S.wizard.batchForm[map[id]]=el.value; };
  });

  // capture
  // real image capture / upload
  document.querySelectorAll("[data-action='open-camera']").forEach(b=>b.onclick=()=>openCamera({}));
  document.querySelectorAll("[data-action='open-upload']").forEach(b=>b.onclick=()=>openFilePicker({}));
  document.querySelectorAll("[data-action='replace-image']").forEach(b=>b.onclick=()=>openFilePicker({replaceIndex:parseInt(b.dataset.idx)}));
  document.querySelectorAll("[data-remove-image]").forEach(b=>b.onclick=()=>removeImage(parseInt(b.dataset.removeImage)));
  document.querySelectorAll("[data-select-image]").forEach(b=>b.onclick=()=>selectImage(parseInt(b.dataset.selectImage)));
  document.querySelectorAll("[data-action='start-guided']").forEach(b=>b.onclick=startGuidedCapture);
  document.querySelectorAll("[data-select-sample]").forEach(b=>b.onclick=()=>{ S.wizard.selectedSample=b.dataset.selectSample; render(); });
  document.querySelectorAll("[data-action='start-ai-detection']").forEach(b=>b.onclick=()=>startAIDetection(S.wizard.selectedSample||"bulk"));
  document.querySelectorAll("[data-action='skip-guided']").forEach(b=>b.onclick=skipGuidedView);
  document.querySelectorAll("[data-action='end-guided']").forEach(b=>b.onclick=endGuidedCapture);
  document.querySelectorAll("[data-image-tab]").forEach(b=>b.onclick=()=>{ S.wizard.activeImageTab=parseInt(b.dataset.imageTab); render(); });
  document.querySelectorAll("[data-view-mode]").forEach(b=>b.onclick=()=>{ S.wizard.viewMode=b.dataset.viewMode; render(); });
  // camera modal controls
  const camCancel=document.getElementById("cam-cancel"); if(camCancel) camCancel.onclick=closeCamera;
  const camShutter=document.getElementById("cam-shutter"); if(camShutter) camShutter.onclick=captureCameraFrame;
  const camTorch=document.getElementById("cam-torch"); if(camTorch) camTorch.onclick=toggleTorch;
  const camSwitch=document.getElementById("cam-switch"); if(camSwitch) camSwitch.onclick=switchCamera;
  const camRetake=document.getElementById("cam-retake"); if(camRetake) camRetake.onclick=retakeCameraFrame;
  const camUse=document.getElementById("cam-use"); if(camUse) camUse.onclick=useCameraFrame;
  const camCloseErr=document.getElementById("cam-close-err"); if(camCloseErr) camCloseErr.onclick=closeCamera;
  const camCancelReq=document.getElementById("cam-cancel-requesting"); if(camCancelReq) camCancelReq.onclick=closeCamera;
  document.querySelectorAll("[data-cam-action]").forEach(b=>b.onclick=()=>{
    const action=b.dataset.camAction; const ri=S.wizard.replaceIndex;
    if(action==="upload"){ closeCamera(); openFilePicker({replaceIndex:ri}); }
    else if(action==="retry"){ openCamera({replaceIndex:ri}); }
  });

  // results filters
  document.querySelectorAll("[data-results-filter]").forEach(b=>b.onclick=()=>{ S.wizard.resultsFilter=b.dataset.resultsFilter; render(); });
  document.querySelectorAll("[data-onion]").forEach(b=>b.onclick=()=>{ S.wizard.selectedOnionId=b.dataset.onion; render(); });
  document.querySelectorAll("[data-onion-row]").forEach(b=>b.onclick=()=>{ S.wizard.selectedOnionId=b.dataset.onionRow; render(); });

  // onion modal
  const modalClose=document.getElementById("onion-modal-close"); if(modalClose) modalClose.onclick=()=>{ S.wizard.selectedOnionId=null; render(); };
  const modalOverlay=document.getElementById("onion-modal-overlay"); if(modalOverlay) modalOverlay.onclick=(e)=>{ if(e.target.id==="onion-modal-overlay"){ S.wizard.selectedOnionId=null; render(); } };
  document.querySelectorAll("[data-onion-action]").forEach(b=>b.onclick=()=>onionAction(b.dataset.onionAction));

  // sampling / smart reinspect
  const addSample=document.querySelector("[data-action='add-sample']"); if(addSample) addSample.onclick=()=>{ toast("Additional sample captured and queued for analysis","success"); };
  const smartReinspect=document.querySelector("[data-action='smart-reinspect']"); if(smartReinspect) smartReinspect.onclick=()=>{
    const low=S.wizard.onions.filter(o=>o.confidence<75);
    if(low.length===0){ toast("No low-confidence onions remaining","success"); return; }
    toast(`Capture another angle of ${low[0].id}. Capture another sample from the center of the batch.`,"warn");
  };

  // heatmap filter
  document.querySelectorAll("[data-heatmap-filter]").forEach(b=>b.onclick=()=>{ S.wizard.heatmapFilter=b.dataset.heatmapFilter; render(); });

  // report actions
  document.querySelectorAll("[data-action='report-download']").forEach(b=>b.onclick=()=>toast("Report PDF generated — ready to save","success"));
  document.querySelectorAll("[data-action='report-print']").forEach(b=>b.onclick=()=>window.print());
  document.querySelectorAll("[data-action='report-share']").forEach(b=>b.onclick=()=>toast("Share link copied","success"));
  document.querySelectorAll("[data-action='report-evidence']").forEach(b=>b.onclick=()=>{ document.getElementById("report-card").scrollIntoView({behavior:"smooth"}); });
  document.querySelectorAll("[data-view-report]").forEach(b=>b.onclick=()=>{ S._reportBatchId=b.dataset.viewReport; S.view="report_view"; render(); });

  // finish wizard
  const finishBtn=document.querySelector("[data-action='finish-wizard']"); if(finishBtn) finishBtn.onclick=finishWizard;

  // history filters
  const hs=document.getElementById("hist-search"); if(hs) hs.oninput=()=>{ S.history_filter.q=hs.value; render(); };
  const hst=document.getElementById("hist-status"); if(hst) hst.onchange=()=>{ S.history_filter.status=hst.value; render(); };
  const hce=document.getElementById("hist-center"); if(hce) hce.onchange=()=>{ S.history_filter.center=hce.value; render(); };
  document.querySelectorAll("[data-compare-pick]").forEach(cb=>cb.onchange=()=>{
    const id=cb.dataset.comparePick;
    if(cb.checked){ if(!S.compare.a) S.compare.a=id; else if(!S.compare.b) S.compare.b=id; else { S.compare.a=S.compare.b; S.compare.b=id; } }
    else { if(S.compare.a===id) S.compare.a=null; if(S.compare.b===id) S.compare.b=null; }
    render();
  });
  const compareBtn=document.getElementById("hist-compare-btn"); if(compareBtn) compareBtn.onclick=()=>{
    if(!S.compare.a||!S.compare.b){ toast("Select two batches to compare","warn"); return; }
    S.view="compare"; render();
  };

  // grading standards
  const stdSave=document.getElementById("std-save"); if(stdSave) stdSave.onclick=()=>toast("Grading configuration saved","success");

  // model tabs
  document.querySelectorAll("[data-model-tab]").forEach(b=>b.onclick=()=>{ S._modelTab=b.dataset.modelTab; render(); });
  document.querySelectorAll("[data-settings-tab]").forEach(b=>b.onclick=()=>{ S._settingsTab=b.dataset.settingsTab; render(); });

  // settings lang
  const setLang=document.getElementById("settings-lang"); if(setLang) setLang.onchange=()=>{ S.language=setLang.value; render(); };
}

function wizardAdvance(){
  const w=S.wizard;
  if(w.steps[w.step]==="capture" && w.images.length===0){ toast("Add at least one image to continue","warn"); return; }
  if(w.steps[w.step]==="results"){ /* nothing extra */ }
  if(w.step < w.steps.length-1){ w.step++; w.selectedOnionId=null; render(); }
}

function onionAction(action){
  const w=S.wizard;
  const o=w.onions.find(x=>x.id===w.selectedOnionId);
  if(!o) return;
  if(action==="confirm"){ o.verified=true; o.status="Confirmed"; toast(o.id+" confirmed","success"); w.selectedOnionId=null; render(); return; }
  if(action==="reinspect"){ o.status="Reinspection requested"; toast("Reinspection requested for "+o.id,"warn"); w.selectedOnionId=null; render(); return; }
  if(action==="correct"){
    const panel=document.getElementById("correct-panel");
    if(panel){
      panel.innerHTML=`
        <div class="hr"></div>
        <div class="field"><label>Replacement class</label>
          <select id="correct-select">${DEFECTS.map(d=>`<option ${d===o.cls?'selected':''}>${d}</option>`).join("")}</select>
        </div>
        <div class="field"><label>Correction reason (optional)</label><input id="correct-reason" placeholder="e.g. Rot not visible from this angle"></div>
        <button class="btn btn-primary sm" id="correct-save"><i class="fa-solid fa-check"></i> Save correction</button>`;
      document.getElementById("correct-save").onclick=()=>{
        const newCls=document.getElementById("correct-select").value;
        const reason=document.getElementById("correct-reason").value;
        o.originalCls=o.cls; o.cls=newCls; o.status="Corrected"; o.verified=true; o.reason=reason;
        toast(o.id+" corrected to "+newCls,"success");
        w.selectedOnionId=null; render();
      };
    }
  }
}

function finishWizard(){
  const w=S.wizard;
  const newBatch={
    batchId:w.batchForm.batchId, assessmentId:"AS-"+pad(9000+randi(1,999),4), center:w.batchForm.center,
    date:new Date(), operator:w.batchForm.operator,
    supplier: w.batchForm.supplier || "Not specified", qtyKg: parseInt(w.batchForm.qty) || null,
    onions:w.onions, metrics:w.metrics, images:w.images,
    status: w.metrics.rejectedPct>28?"Rejected":(w.metrics.qualityScore<62?"Needs review":"Completed"),
    humanVerified: w.onions.filter(o=>o.verified).length, corrections:[], fingerprint:w.fingerprint
  };
  S.batches.unshift(newBatch);
  if(!S.online) S.syncQueue++;
  toast("Assessment "+newBatch.batchId+" saved to batch history","success");
  S.view="history"; render();
}

function runVoiceCommand(cmd){
  S.voiceOpen=false;
  toast('Heard: "'+cmd+'"',"info");
  setTimeout(()=>{
    if(cmd.includes("Start new batch")){ startNewWizard(); S.view="wizard"; }
    else if(cmd.includes("rotten")){ S.view="wizard"; if(S.wizard.onions.length){ S.wizard.step=S.wizard.steps.indexOf("results"); S.wizard.resultsFilter="Rotten"; } }
    else if(cmd.includes("low confidence")){ S.view="wizard"; if(S.wizard.onions.length){ S.wizard.step=S.wizard.steps.indexOf("review"); } }
    else if(cmd.includes("report")){ S.view="wizard"; if(S.wizard.onions.length){ S.wizard.step=S.wizard.steps.indexOf("report"); } }
    else if(cmd.includes("history")){ S.view="history"; }
    render();
  },500);
}

function doLogout(){
  S.authed=false; S.profileOpen=false; S.view="dashboard";
  render();
  toast("Signed out securely","success");
}

/* ---------------------------- INIT ---------------------------- */
render();
</script>
</body>
