<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnionGrade AI — Procurement Quality Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ========================= DESIGN TOKENS ========================= */
:root{
  --bg:#F5F4EE;
  --surface:#FFFFFF;
  --surface-2:#FBFAF6;
  --ink:#20261F;
  --ink-soft:#5B6259;
  --ink-faint:#8B9186;
  --primary:#2F5233;
  --primary-dark:#1E3A22;
  --primary-light:#E3EBDF;
  --accent:#B5651D;
  --accent-light:#F4E5D2;
  --line:#DEDBCC;
  --line-soft:#EAE8DC;
  --success:#3F7D4F;
  --success-bg:#E3F0E5;
  --warn:#B4831C;
  --warn-bg:#FAF0D9;
  --danger:#A23F3F;
  --danger-bg:#F6E3E0;
  --info:#2E6E8E;
  --info-bg:#E1EEF4;
  --radius:8px;
  --radius-sm:5px;
  --font-head:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --shadow:0 1px 2px rgba(32,38,31,.06), 0 1px 0 rgba(32,38,31,.03);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;margin:0;color:var(--ink);}
p{margin:0;}
button{font-family:var(--font-body);cursor:pointer;}
a{color:inherit;}
::selection{background:var(--primary-light);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* ---------- layout shell ---------- */
#app{min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--primary-dark);color:#EDF1E9;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(237,241,233,.12);
}
.sidebar-brand .mark{
  width:34px;height:34px;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-head);
  font-weight:700;color:#fff;font-size:16px;flex-shrink:0;
}
.sidebar-brand .name{font-family:var(--font-head);font-weight:600;font-size:15.5px;line-height:1.2;}
.sidebar-brand .name span{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:#B7C2B2;margin-top:2px;}
.sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);
  color:#CBD3C6;text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item i{width:16px;text-align:center;font-size:14px;color:#93A18C;}
.nav-item:hover{background:rgba(237,241,233,.07);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item.active i{color:#fff;}
.sidebar-foot{padding:14px 18px;border-top:1px solid rgba(237,241,233,.12);font-size:11.5px;color:#8FA089;}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:60px;flex-shrink:0;position:sticky;top:0;z-index:30;gap:16px;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.topbar-left .ctx{display:flex;flex-direction:column;line-height:1.25;}
.topbar-left .ctx b{font-size:13px;font-weight:600;}
.topbar-left .ctx span{font-size:11.5px;color:var(--ink-soft);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;font-size:14px;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);}
#burger{display:none;}
.sidebar-backdrop{display:none;}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface);}
.conn-pill{
  display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:20px;
  border:1px solid var(--line);background:var(--surface);
}
.conn-pill .dotc{width:7px;height:7px;border-radius:50%;}
.conn-pill.online .dotc{background:var(--success);}
.conn-pill.offline .dotc{background:var(--danger);}
.select-pill{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
  padding:6px 10px;font-size:12.5px;font-weight:500;color:var(--ink);
}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;font-family:var(--font-head);
}
.content{flex:1;padding:24px 26px 60px;max-width:1360px;width:100%;margin:0 auto;}
.offline-banner{
  background:var(--warn-bg);color:#6B4E10;border-bottom:1px solid #E7CE8E;padding:8px 22px;font-size:12.5px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.offline-banner b{font-weight:700;}
.mini-btn{
  border:1px solid rgba(0,0,0,.15);background:#fff;border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:600;
}

/* ---------- generic building blocks ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.page-head h1{font-size:21px;}
.page-head .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;max-width:640px;}
.btn{
  border-radius:var(--radius-sm);padding:9px 16px;font-size:13px;font-weight:600;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{filter:brightness(.94);}
.btn-outline{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-outline:hover{background:var(--surface-2);}
.btn-ghost{background:transparent;color:var(--ink-soft);border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn-danger{background:var(--danger);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:6px 11px;font-size:12px;}

.grid{display:grid;gap:16px;}
.kpi-row{grid-template-columns:repeat(6,1fr);}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.card-head h3{font-size:14px;}
.card-head .hint{font-size:11.5px;color:var(--ink-faint);}
.kpi{padding:16px;}
.kpi .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
.kpi .val{font-family:var(--font-head);font-size:25px;font-weight:700;line-height:1;}
.kpi .delta{font-size:11px;margin-top:7px;display:flex;align-items:center;gap:4px;font-weight:600;}
.kpi .delta.up{color:var(--success);}
.kpi .delta.down{color:var(--danger);}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.1px;
}
.badge.healthy{background:var(--success-bg);color:var(--success);}
.badge.damaged{background:var(--warn-bg);color:#8A5E13;}
.badge.rotten{background:var(--danger-bg);color:var(--danger);}
.badge.sprouted{background:#EDE6F5;color:#6A4A95;}
.badge.undersized{background:var(--info-bg);color:var(--info);}
.badge.high{background:var(--success-bg);color:var(--success);}
.badge.medium{background:var(--warn-bg);color:#8A5E13;}
.badge.low{background:var(--danger-bg);color:var(--danger);}
.badge.neutral{background:var(--line-soft);color:var(--ink-soft);}
.badge.demo{background:var(--accent-light);color:var(--accent);}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{
  text-align:left;font-size:11px;text-transform:none;color:var(--ink-soft);font-weight:600;
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.row-click{cursor:pointer;}

.notice{
  border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start;
  border:1px solid;
}
.notice.demo{background:var(--accent-light);border-color:#E4C39A;color:#7A4A15;}
.notice.info{background:var(--info-bg);border-color:#BEDBE7;color:#1F5670;}
.notice.warn{background:var(--warn-bg);border-color:#E7CE8E;color:#6B4E10;}
.notice.success{background:var(--success-bg);border-color:#BEE0C4;color:#245430;}
.notice i{margin-top:1px;}

.chip{
  border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:12px;
  font-weight:600;color:var(--ink-soft);
}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

.progressbar{height:7px;border-radius:20px;background:var(--line-soft);overflow:hidden;}
.progressbar > div{height:100%;background:var(--primary);border-radius:20px;transition:width .4s ease;}

.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.gauge-num{font-family:var(--font-head);font-size:26px;font-weight:700;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;font-size:13px;
  font-family:var(--font-body);background:var(--surface);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
.field .helptext{font-size:11px;color:var(--ink-faint);margin-top:5px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* wizard */
.wizard-rail{display:flex;align-items:center;gap:0;margin-bottom:22px;overflow-x:auto;padding-bottom:6px;}
.wizard-step{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.wizard-step .num{
  width:24px;height:24px;border-radius:50%;background:var(--line-soft);color:var(--ink-faint);font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;
}
.wizard-step.done .num{background:var(--success);color:#fff;}
.wizard-step.active .num{background:var(--primary);color:#fff;}
.wizard-step .lbl{font-size:11.5px;font-weight:600;color:var(--ink-faint);white-space:nowrap;}
.wizard-step.active .lbl,.wizard-step.done .lbl{color:var(--ink);}
.wizard-sep{width:22px;height:1px;background:var(--line);margin:0 6px;flex-shrink:0;}
.wizard-actions{display:flex;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}

/* image thumbs */
.img-swatch{
  width:100%;aspect-ratio:4/3;border-radius:var(--radius-sm);position:relative;overflow:hidden;border:1px solid var(--line);
}
.img-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:14px;}
.img-thumb-cell{position:relative;}
.img-thumb-cell .cap{font-size:11px;font-weight:600;margin-top:6px;color:var(--ink-soft);}
.img-thumb-cell .rm{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:rgba(32,38,31,.55);color:#fff;border:none;font-size:11px;}
.add-tile{
  aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:var(--radius-sm);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;color:var(--ink-faint);font-size:11.5px;font-weight:600;background:var(--surface-2);
}

.checklist{display:flex;flex-direction:column;gap:9px;}
.check-row{display:flex;align-items:center;gap:9px;font-size:13px;}
.check-row i{width:17px;text-align:center;}
.check-row.ok i{color:var(--success);}
.check-row.warn i{color:var(--warn);}
.check-row.pending i{color:var(--ink-faint);}
.check-row.bad{color:var(--danger);}

/* pile visual */
.pile-wrap{
  position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 30%, #C9A46B, #A9814E 55%, #8A6A3E 100%);
  aspect-ratio:16/10;
}
.pile-wrap.small{aspect-ratio:16/9;}
.onion-dot{
  position:absolute;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;
  border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.onion-dot:hover{outline:2px solid #fff;outline-offset:1px;}
.onion-dot.sel{outline:3px solid #fff;outline-offset:1px;}
.heat-cell{position:absolute;}
.pile-legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.92);border-radius:6px;padding:7px 10px;font-size:10.5px;display:flex;gap:10px;flex-wrap:wrap;}
.pile-legend span{display:flex;align-items:center;gap:5px;font-weight:600;}
.pile-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,24,17,.5);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal.wide{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:15px;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.close-x{background:none;border:none;font-size:16px;color:var(--ink-soft);width:28px;height:28px;border-radius:6px;}
.close-x:hover{background:var(--surface-2);}

/* toasts */
#toast-stack{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:12.8px;display:flex;align-items:center;gap:9px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastin .25s ease;max-width:320px;
}
.toast.success i{color:#8FE0A3;}
.toast.warn i{color:#F0CB7A;}
.toast.error i{color:#F0A0A0;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* misc */
.hr{height:1px;background:var(--line);margin:20px 0;}
.section-title{font-size:13.5px;font-weight:700;margin-bottom:12px;}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);font-size:11.5px;}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.tabbar button{
  background:none;border:none;padding:10px 4px;margin-right:20px;font-size:13px;font-weight:600;color:var(--ink-faint);
  border-bottom:2px solid transparent;
}
.tabbar button.active{color:var(--primary);border-color:var(--primary);}
.empty-state{
  text-align:center;padding:50px 20px;color:var(--ink-soft);
}
.empty-state i{font-size:26px;color:var(--ink-faint);margin-bottom:10px;}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.search-box{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 11px;
  background:var(--surface);flex:1;min-width:180px;
}
.search-box input{border:none;outline:none;font-size:12.8px;flex:1;background:transparent;}
.print-only{display:none;}
@media print{
  .sidebar,.topbar,.offline-banner,.wizard-actions,.no-print{display:none !important;}
  .content{padding:0;max-width:none;}
  body{background:#fff;}
  .print-only{display:block;}
}
/* ---- real image capture / preview ---- */
.capture-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.guided-banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--primary-light);
  border:1px solid #C7D8C2;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;flex-wrap:wrap;
}
.guided-banner .g-step{font-size:11.5px;color:var(--primary-dark);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.guided-banner .g-title{font-size:14px;font-weight:700;color:var(--ink);}
.preview-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);margin-bottom:16px;}
.preview-card .preview-img-wrap{
  width:100%;max-height:420px;min-height:220px;background:#EAE8DC;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.preview-card .preview-img-wrap img{width:100%;height:100%;object-fit:contain;max-height:420px;background:#20261F;}
.preview-meta{padding:14px 16px;}
.preview-meta .fname{font-weight:700;font-size:13.5px;margin-bottom:3px;word-break:break-all;}
.preview-meta .fmeta{font-size:11.8px;color:var(--ink-soft);margin-bottom:10px;}
.quality-result{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:8px;}
.quality-result.good{color:var(--success);}
.quality-result.attention{color:var(--warn);}
.quality-issue{font-size:12px;color:#6B4E10;background:var(--warn-bg);border-radius:6px;padding:7px 10px;margin-bottom:5px;}
.preview-btnrow{display:flex;gap:8px;padding:0 16px 16px;}
.thumb-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:6px;}
.thumb-cell{position:relative;border-radius:var(--radius-sm);overflow:hidden;border:2px solid transparent;cursor:pointer;aspect-ratio:1/1;background:#EAE8DC;}
.thumb-cell.active{border-color:var(--primary);}
.thumb-cell img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-cell .qbadge{position:absolute;bottom:3px;left:3px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;}
.thumb-cell .qbadge.good{background:var(--success);}
.thumb-cell .qbadge.attention{background:var(--warn);}
.thumb-cell .viewlabel{position:absolute;top:0;left:0;right:0;background:rgba(32,38,31,.65);color:#fff;font-size:9px;font-weight:700;padding:2px 4px;text-align:center;}
.thumb-cell .rm2{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(32,38,31,.65);color:#fff;border:none;font-size:10px;line-height:1;}
.add-thumb-tile{
  aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:var(--radius-sm);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--ink-faint);font-size:10px;font-weight:700;background:var(--surface-2);
}
/* camera modal */
.camera-modal{background:#0E120E;border-radius:12px;max-width:520px;width:100%;overflow:hidden;color:#fff;}
.camera-viewport{position:relative;width:100%;aspect-ratio:3/4;background:#000;overflow:hidden;}
.camera-viewport video, .camera-viewport img.captured{width:100%;height:100%;object-fit:cover;}
.camera-guide{position:absolute;inset:12%;border:2px dashed rgba(255,255,255,.55);border-radius:14px;pointer-events:none;}
.camera-topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:2;}
.camera-topbar button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);border:none;color:#fff;font-size:14px;}
.camera-bottombar{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:28px;padding:20px;z-index:2;}
.shutter-btn{width:66px;height:66px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);}

.retake-row{display:flex;gap:10px;padding:14px;background:#171B15;}

.onion-label{
  position:absolute;transform:translate(-50%,-135%);background:rgba(255,255,255,.95);border:1.5px solid;border-radius:5px;

.bbox{
  position:absolute;border:2.5px solid;border-radius:6px;background:rgba(255,255,255,.03);cursor:pointer;

  position:absolute;top:-2px;left:-2.5px;transform:translateY(-100%);color:#fff;font-size:10.5px;font-weight:700;

  .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:75;}

    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  for(let i=1;i<=n;i++){
    const cls=choice(DEFECTS,[55,15,10,10,10],rf);
    let conf;
    const forceLow = (lowConfPlaced<lowConfTarget) && (n-i <= (lowConfTarget-lowConfPlaced)*3) && rand(0,1,rf)<0.4;
    if(cls==="Healthy") conf = forceLow? rand(55,74,rf): rand(80,99,rf);
    else conf = forceLow? rand(50,72,rf): rand(68,97,rf);
    if(conf<75) lowConfPlaced++;
    const mm = cls==="Undersized" ? rand(28,44,rf) : rand(40,68,rf);
    list.push({
      id:"ON-"+pad(i,3),
      cls, confidence:Math.round(conf),
      size:Math.round(mm),
      sizeCat:sizeCategory(mm),
      status:"AI result", // AI result | Confirmed | Corrected | Reinspection requested
      verified:false,
      imageIndex: (i-1)%imgCount,
      x: rand(6,94,rf), y: rand(10,90,rf),
      r: rand(2.1,3.4,rf)
    });
  }
  return list;
}

function computeMetrics(onions){
  const n=onions.length;
  const cnt = c=>onions.filter(o=>o.cls===c).length;
  const healthy=cnt("Healthy"), damaged=cnt("Damaged"), rotten=cnt("Rotten"), sprouted=cnt("Sprouted"), undersized=cnt("Undersized");
  const gradeA = onions.filter(o=>o.cls==="Healthy" && o.sizeCat!=="Small").length;
  const urs = onions.filter(o=>o.cls==="Healthy" && o.sizeCat==="Small").length;
  const rejected = onions.filter(o=>o.cls==="Rotten" || o.cls==="Damaged").length;
  const avgConf = onions.reduce((a,o)=>a+o.confidence,0)/n;
  const sizes = onions.map(o=>o.size);
  const meanSize = sizes.reduce((a,b)=>a+b,0)/n;
  const variance = sizes.reduce((a,b)=>a+Math.pow(b-meanSize,2),0)/n;
  const sizeUniformity = Math.max(0,Math.min(100, 100 - Math.sqrt(variance)*2.2));
  const appearanceUniformity = Math.max(0,Math.min(100, 100 - (5-((healthy)/n*5))*14));
  const distinctDefectTypes = [damaged,rotten,sprouted,undersized].filter(x=>x>0).length;
  const defectDistUniformity = Math.max(0,Math.min(100, 100 - distinctDefectTypes*9 - (rejected/n*40)));
  const uniformity = Math.round((sizeUniformity*0.4 + appearanceUniformity*0.35 + defectDistUniformity*0.25));
  const qualityScore = Math.round((healthy/n*100)*0.55 + (100-(rejected/n*100))*0.30 + avgConf*0.15);
  return {
    n,healthy,damaged,rotten,sprouted,undersized,
    gradeAPct:Math.round(gradeA/n*100), ursPct:Math.round(urs/n*100), rejectedPct:Math.round(rejected/n*100),
    avgConf:Math.round(avgConf), qualityScore:Math.min(100,qualityScore), uniformity,
    sizeUniformity:Math.round(sizeUniformity), appearanceUniformity:Math.round(appearanceUniformity), defectDistUniformity:Math.round(defectDistUniformity),
    meanSize:Math.round(meanSize)
  };
}

function seedBatches(){
  const batches=[];
  const now=new Date(2026,8,11,9,0);
  for(let i=1;i<=8;i++){
    const rf=mulberry32(42000+i*977); // fixed seed per batch — same numbers on every load
    const onions=generateOnions(60+Math.floor(rf()*41), 1, rf);
    const m=computeMetrics(onions);
    const d=new Date(now); d.setDate(d.getDate()-i*2 - Math.floor(rf()*2)); d.setHours(8+Math.floor(rf()*10),Math.floor(rf()*60));
    batches.push({
      batchId:"ON-2026-"+pad(9-i,3),
      assessmentId:"AS-"+pad(2000+i,4),
      center:CENTERS[Math.floor(rf()*CENTERS.length)],
      date:d,
      operator:["R. Kadam","S. Iyer","M. Pawar","A. Deshmukh"][Math.floor(rf()*4)],
      supplier:["ABC Farms","Deshmukh Agro Traders","Nashik Valley Growers","Sunrise Onion Suppliers"][Math.floor(rf()*4)],
      qtyKg: 1500+Math.floor(rf()*20)*100,
      images:2+Math.floor(rf()*4),
      onions, metrics:m,
      status: m.rejectedPct>28? "Rejected" : (m.qualityScore<62? "Needs review":"Completed"),
      humanVerified: onions.filter(o=>o.verified).length,
      corrections:[],
      fingerprint:null
    });
  }
  return batches.sort((a,b)=>b.date-a.date);
}

// If the Chart.js CDN script didn't load (offline, blocked by a network policy, ad-blocker,
// etc.) we show a small note instead of throwing a ReferenceError that would otherwise break
// the rest of the page render.
function drawChart(canvasEl, config){
  if(!canvasEl) return;
  if(typeof Chart==="undefined"){
    const note=document.createElement("div");
    note.className="faint";
    note.style.cssText="text-align:center;padding:26px 10px;";
    note.textContent="Chart library unavailable — check your internet connection.";
    canvasEl.replaceWith(note);
    return;
  }
  try{ new Chart(canvasEl, config); }
  catch(e){ console.error("Chart render error:", e); }
}
function drawQRCode(containerEl, text){
  if(!containerEl) return;
  if(typeof QRCode==="undefined"){
    containerEl.innerHTML='<div class="faint" style="padding:10px;font-size:10.5px;">QR library unavailable — check your internet connection.</div>';
    return;
  }
  try{
    containerEl.innerHTML="";
    new QRCode(containerEl,{text, width:132, height:132, colorDark:"#20261F", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M});
  }catch(e){ console.error("QR render error:", e); }
}

function toast(msg,type="success"){
  const icon = type==="success"?"fa-circle-check":type==="warn"?"fa-triangle-exclamation":type==="error"?"fa-circle-exclamation":"fa-circle-info";
  const el=document.createElement("div");
  el.className="toast "+type;
  el.innerHTML=`<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
  document.getElementById("toast-stack").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 3400);
}

/* ---------------------------- IMAGE QUALITY ANALYSIS (real, on-device) ---------------------------- */
function analyzeImageQuality(imgEl){
  return new Promise(resolve=>{
    try{
      const w=imgEl.naturalWidth, h=imgEl.naturalHeight;
      const canvas=document.createElement("canvas");
      const sw=120, sh=Math.max(1,Math.round(sw*(h/w)));
      canvas.width=sw; canvas.height=sh;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(imgEl,0,0,sw,sh);
      const data=ctx.getImageData(0,0,sw,sh).data;
      let sum=0, sumSq=0, count=0;
      for(let i=0;i<data.length;i+=4){
        const lum = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
        sum+=lum; sumSq+=lum*lum; count++;
      }
      const mean=sum/count;
      const variance=(sumSq/count)-(mean*mean);
      const stddev=Math.sqrt(Math.max(0,variance));
      const issues=[];
      if(w*h < 300*300) issues.push("Image resolution is quite low. Please capture a higher-resolution image if possible.");
      if(mean < 65) issues.push("Image is too dark. Please capture the onion in better lighting.");
      if(mean > 205) issues.push("Image is very bright / overexposed. Please reduce glare or direct light.");
      if(stddev < 14) issues.push("Image may be blurry or lacks visible detail. Hold the camera steady and get closer to the batch.");
      resolve({status: issues.length?"Needs Attention":"Good", issues, brightness:Math.round(mean), contrast:Math.round(stddev), width:w, height:h});
    }catch(e){
      resolve({status:"Good", issues:[], brightness:null, contrast:null, width:imgEl.naturalWidth||0, height:imgEl.naturalHeight||0});
    }
  });
}

function fmtBytes(b){
  if(b<1024) return b+" B";
  if(b<1024*1024) return (b/1024).toFixed(0)+" KB";
  return (b/(1024*1024)).toFixed(1)+" MB";
}
function extFromType(type){
  if(type==="image/jpeg") return "JPG";
  if(type==="image/png") return "PNG";
  if(type==="image/webp") return "WEBP";
  return (type.split("/")[1]||"image").toUpperCase();
}
const ACCEPTED_TYPES=["image/jpeg","image/png","image/webp"];
const ACCEPTED_EXTENSIONS=["jpg","jpeg","png","webp"];
const KNOWN_UNSUPPORTED_IMAGE_TYPES=["image/gif","image/bmp","image/tiff","image/heic","image/heif","image/svg+xml"];
const MAX_FILE_SIZE=40*1024*1024; // 40MB — generous enough for modern high-resolution phone photos

function fileExtension(name){
  const m=/\.([a-zA-Z0-9]+)$/.exec(name||"");
  return m ? m[1].toLowerCase() : "";
}

/**
 * Real devices and OS file pickers frequently hand back a File whose
 * `.type` is empty or unreliable (synced/cloud files, some Android
 * pickers, some camera apps) even though the bytes are a perfectly
 * valid JPG/PNG/WEBP. Relying on `.type` alone as a gate causes exactly
 * the "valid photo rejected" bug this fix addresses, so we only reject
 * up front when we have *positive* evidence the file is not a supported
 * image (a clearly different/unsupported MIME type, or a file extension
 * we know is unsupported). Anything ambiguous is allowed through and the
 * real decode (Image().onload / onerror) is the final authority.
 */
function classifyFile(file){
  const type=(file.type||"").toLowerCase();
  const ext=fileExtension(file.name);
  if(type && ACCEPTED_TYPES.includes(type)) return {ok:true};
  if(type && KNOWN_UNSUPPORTED_IMAGE_TYPES.includes(type)) return {ok:false, reason:"format"};
  if(type && !type.startsWith("image/")){
    // Browser positively identified this as a non-image file (pdf, video, text, etc.)
    if(ext && ACCEPTED_EXTENSIONS.includes(ext)) return {ok:true}; // extension disagrees with a possibly-wrong MIME sniff — trust the extension
    return {ok:false, reason:"notimage"};
  }
  if(ext){
    if(ACCEPTED_EXTENSIONS.includes(ext)) return {ok:true};
    if(["gif","bmp","tiff","tif","heic","heif","svg"].includes(ext)) return {ok:false, reason:"format"};
  }
  // No reliable type and no recognizable extension (e.g. a camera roll export with a
  // generic name) — don't block it pre-emptively, let the browser attempt to decode it.
  return {ok:true, unknown:true};
}

function addImageFile(file, opts){
  opts=opts||{};
  return new Promise(async (resolve,reject)=>{
    if(!file){
      console.error("Image upload error: no file provided");
      toast("Unable to load this image. Please try another file.","error");
      reject(new Error("no file")); return;
    }
    const verdict=classifyFile(file);
    if(!verdict.ok){
      if(verdict.reason==="format"){
        console.error("Image upload error: unsupported format", file.type, file.name);
        toast("This image format isn't supported. Please choose JPG, JPEG, PNG or WEBP.","error");
        reject(new Error("bad type")); return;
      }
      console.error("Image upload error: selected file is not an image", file.type, file.name);
      toast("This file doesn't look like an image. Please choose a JPG, JPEG, PNG or WEBP photo.","error");
      reject(new Error("not an image")); return;
    }
    if(file.size && file.size>MAX_FILE_SIZE){
      console.error("Image upload error: file too large", file.size);
      toast("This file is too large. Please choose an image under 40 MB.","error");
      reject(new Error("too large")); return;
    }
    let dataUrl;
    try{ dataUrl = await new Promise((res,rej)=>{
      const reader=new FileReader();
      reader.onload=()=>res(reader.result);
      reader.onerror=()=>rej(reader.error||new Error("read error"));
      reader.onabort=()=>rej(new Error("read aborted"));
      reader.readAsDataURL(file);
    }); }
    catch(e){
      console.error("Image upload error: could not read file", e);
      toast("Unable to load this image. Please try another file.","error");
      reject(e); return;
    }
    const img=new Image();
    img.onload=async ()=>{
      let quality;
      try{ quality=await analyzeImageQuality(img); }
      catch(e){ console.error("Quality check error:", e); quality={status:"Good",issues:[],brightness:null,contrast:null,width:img.naturalWidth,height:img.naturalHeight}; }
      const entry={
        id:"IMG-"+Math.random().toString(36).slice(2,9),
        url:dataUrl, name:file.name||("image-"+Date.now()+"."+extFromType(file.type).toLowerCase()),
        width:img.naturalWidth, height:img.naturalHeight, sizeBytes:file.size||0, type:file.type,
        source: opts.source||"upload", viewLabel: opts.viewLabel||null, quality
      };
      const w=S.wizard;
      if(typeof opts.replaceIndex==="number" && w.images[opts.replaceIndex]){
        w.images[opts.replaceIndex]=entry;
        w.selectedImageIndex=opts.replaceIndex;
      } else {
        w.images.push(entry);
        w.selectedImageIndex=w.images.length-1;
      }
      resolve(entry);
    };
    img.onerror=(e)=>{
      console.error("Image upload error: browser could not decode this file (possibly corrupted or an unsupported variant)", e, file.name, file.type);
      toast("This image could not be opened — it may be corrupted or in an unsupported format. Please try another file.","error");
      reject(new Error("decode error"));
    };
    img.src=dataUrl;
  });
}

async function handleFilesSelected(fileList, opts){
  opts=opts||{};
  const files=Array.from(fileList||[]);
  if(files.length===0) return;
  if(files.length===1) toast("Loading image…","info");
  let added=0;
  for(const file of files){
    try{

      if(S.wizard.guidedMode && !viewLabel){ viewLabel=GUIDED_VIEWS[Math.min(S.wizard.guidedIndex,GUIDED_VIEWS.length-1)]; }
      await addImageFile(file, {source:"upload", viewLabel, replaceIndex: opts.replaceIndex});
      added++;
      if(S.wizard.guidedMode && opts.replaceIndex==null){ S.wizard.guidedIndex=Math.min(S.wizard.guidedIndex+1,GUIDED_VIEWS.length-1); }
    }catch(e){ /* specific toast already shown by addImageFile */ }
  }
  if(added>0){ toast(added===1?"Image added":added+" images added","success"); }
  render();
}

/* ---------------------------- FIXED SAMPLE INSPECTION IMAGES ---------------------------- */
/* Decodes a "data:<mime>;base64,<data>" string into a Blob without using fetch().
   fetch() on a data: URI is blocked under some restrictive CSPs / sandboxed preview
   frames (seen as "Failed to fetch"), so we decode the base64 payload ourselves. */
function dataURLToBlob(dataUrl){
  const [header, base64] = dataUrl.split(",");
  const mimeMatch = /data:([^;]+);base64/.exec(header);
  const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}

function openFilePicker(opts){
  opts=opts||{};
  // Build a real file input, attached to the document, so every browser
  // (including strict/mobile browsers that require the element to be in
  // the DOM) reliably opens the native File Explorer / gallery picker.
  const input=document.createElement("input");
  input.type="file";
  input.accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp";
  input.multiple = (opts.replaceIndex==null);
  input.style.position="fixed";
  input.style.left="-9999px";
  input.style.top="0";
  input.setAttribute("aria-hidden","true");
  document.body.appendChild(input);
  const cleanup=()=>{ if(input.parentNode) input.parentNode.removeChild(input); };
  input.addEventListener("change", ()=>{
    handleFilesSelected(input.files, opts);
    cleanup();
  });
  // Modern browsers fire 'cancel' when the user closes the picker without choosing a file.
  input.addEventListener("cancel", cleanup);
  // Safety net in case neither 'change' nor 'cancel' fires (older browsers).
  window.setTimeout(()=>{ if(input.parentNode && !input.files.length) cleanup(); }, 60000);
  input.click();
}

/* ---------------------------- CAMERA CAPTURE ---------------------------- */
function resetCameraFlags(){
  S.wizard.cameraError=null; S.wizard.cameraErrorType=null; S.wizard.cameraErrorActions=null;
}
function setCameraError(type,message,actions){
  S.wizard.cameraStatus="error";
  S.wizard.cameraErrorType=type;
  S.wizard.cameraError=message;
  S.wizard.cameraErrorActions=actions||[];
  render();

async function openCamera(opts){
  opts=opts||{};
  S.wizard.replaceIndex = (typeof opts.replaceIndex==="number")? opts.replaceIndex : null;
  S.wizard.cameraOpen=true; S.wizard.cameraCaptured=null; S.wizard.cameraStatus="requesting";
  resetCameraFlags();
  render();

  // Check the environment before ever calling getUserMedia, so the error
  // shown actually matches the real cause instead of a generic message.
  if(!window.isSecureContext){
    setCameraError("secure","Camera access requires a secure connection. Open this app over HTTPS (or localhost during development) to use the camera.",
      [{label:"Upload image instead",action:"upload"}]);
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setCameraError("unsupported","Camera capture is not supported on this device or browser.",
      [{label:"Upload image instead",action:"upload"}]);
    return;
  }

  // Best-effort permission pre-check (not all browsers support the 'camera' permission name).
  try{
    if(navigator.permissions && navigator.permissions.query){
      const status = await navigator.permissions.query({name:"camera"});
      if(status.state==="denied"){
        setCameraError("denied","Camera permission was denied. Please allow camera access in your browser/device settings, then try again.",
          [{label:"Upload image instead",action:"upload"},{label:"Try again",action:"retry"}]);
        return;
      }
    }
  }catch(e){ /* 'camera' permission name unsupported in this browser — proceed and rely on getUserMedia's own error */ }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.wizard.cameraFacing}, audio:false});
    S.wizard.cameraStream=stream;
    S.wizard.cameraStatus="live";
    render();
    const video=document.getElementById("camera-video");
    if(video){ video.srcObject=stream; try{ await video.play(); }catch(e){ console.error("Camera preview playback error:",e); } }
  }catch(err){
    console.error("Camera error:", err && err.name, err);
    handleCameraError(err);
  }
}

function handleCameraError(err){
  const name = err && err.name;
  const framed = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
  if(name==="NotAllowedError" || name==="PermissionDeniedError" || (name==="SecurityError" && !window.isSecureContext)){
    if(framed){
      setCameraError("denied","Camera access isn't available inside this embedded preview. Open this file directly in your own browser tab (or download it) to use the camera — Upload Image still works here.",
        [{label:"Upload image instead",action:"upload"}]);
    } else {
      setCameraError("denied","Camera permission was denied. Please allow camera access in your browser/device settings, then try again.",
        [{label:"Upload image instead",action:"upload"},{label:"Try again",action:"retry"}]);
    }
  } else if(name==="NotFoundError" || name==="DevicesNotFoundError" || name==="OverconstrainedError"){
    setCameraError("unsupported","Camera capture is not supported on this device or browser.",
      [{label:"Upload image instead",action:"upload"}]);
  } else if(name==="NotReadableError" || name==="TrackStartError"){
    setCameraError("inuse","The camera is currently being used by another application.",
      [{label:"Try again",action:"retry"},{label:"Upload image instead",action:"upload"}]);
  } else if(name==="SecurityError"){
    setCameraError("secure","Camera access requires a secure connection.",
      [{label:"Upload image instead",action:"upload"}]);
  } else {
    setCameraError("prompt","Camera permission is required to take a photo. Your browser may prompt you for access — please allow it and try again.",
      [{label:"Allow camera access",action:"retry"},{label:"Upload image instead",action:"upload"}]);
  }
}

function closeCamera(){
  if(S.wizard.cameraStream){ S.wizard.cameraStream.getTracks().forEach(t=>t.stop()); }
  S.wizard.cameraStream=null; S.wizard.cameraOpen=false; S.wizard.cameraCaptured=null; S.wizard.cameraStatus="idle";
  resetCameraFlags();
  render();
}
function captureCameraFrame(){
  const video=document.getElementById("camera-video");
  if(!video || !video.videoWidth){ toast("Camera isn't ready yet — please wait a moment and try again.","warn"); return; }
  const canvas=document.createElement("canvas");

  canvas.getContext("2d").drawImage(video,0,0);
  S.wizard.cameraCaptured=canvas.toDataURL("image/jpeg",0.92);
  render();
}
function retakeCameraFrame(){ S.wizard.cameraCaptured=null; render(); }
function formatCameraFilename(d){
  const p=n=>String(n).padStart(2,"0");
  return `camera_capture_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}.jpg`;
}
async function useCameraFrame(){
  const dataUrl=S.wizard.cameraCaptured;
  if(!dataUrl) return;
  let file;
  try{
    const blob=dataURLToBlob(dataUrl);
    file=new File([blob], formatCameraFilename(new Date()), {type:"image/jpeg"});
  }catch(e){
    console.error("Camera capture processing error:", e);
    toast("Unable to process this photo. Please retake it.","error");
    return;
  }
  let viewLabel=null;
  if(S.wizard.guidedMode){ viewLabel=GUIDED_VIEWS[Math.min(S.wizard.guidedIndex,GUIDED_VIEWS.length-1)]; }
  const replaceIndex=S.wizard.replaceIndex;

    await addImageFile(file,{source:"camera", viewLabel, replaceIndex});
    if(S.wizard.guidedMode && replaceIndex==null){ S.wizard.guidedIndex=Math.min(S.wizard.guidedIndex+1,GUIDED_VIEWS.length-1); }
    toast("Photo captured","success");
  }catch(e){ /* specific toast already shown by addImageFile */ }
  S.wizard.replaceIndex=null;
  render();
}
async function switchCamera(){
  S.wizard.cameraFacing = S.wizard.cameraFacing==="environment"?"user":"environment";
  if(S.wizard.cameraStream){ S.wizard.cameraStream.getTracks().forEach(t=>t.stop()); }
  S.wizard.cameraStream=null;
  await openCamera({replaceIndex:S.wizard.replaceIndex});
}
async function toggleTorch(){
  if(!S.wizard.cameraStream) return;
  const track=S.wizard.cameraStream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities():{};
  if(!caps.torch){ toast("Flash/torch isn't supported on this camera","warn"); return; }
  try{
    S.wizard.cameraTorchOn=!S.wizard.cameraTorchOn;
    await track.applyConstraints({advanced:[{torch:S.wizard.cameraTorchOn}]});
    render();
  }catch(e){ console.error("Torch control error:",e); toast("Unable to control flash on this device","warn"); }
}

function removeImage(idx){
  const w=S.wizard;
  w.images.splice(idx,1);
  if(w.selectedImageIndex===idx) w.selectedImageIndex = w.images.length? Math.max(0,idx-1) : null;
  else if(w.selectedImageIndex>idx) w.selectedImageIndex--;
  render();
  toast("Image removed","success");
}
function selectImage(idx){ S.wizard.selectedImageIndex=idx; render(); }
function startGuidedCapture(){ S.wizard.guidedMode=true; S.wizard.guidedIndex=0; render(); }
function skipGuidedView(){ S.wizard.guidedIndex=Math.min(S.wizard.guidedIndex+1,GUIDED_VIEWS.length-1); render(); }
function endGuidedCapture(){ S.wizard.guidedMode=false; render(); }

function renderWizard(){
  if(!S.wizard.batchForm.batchId) startNewWizard();
  const w=S.wizard;
  const railHtml = w.steps.map((s,i)=>{
    const cls = i<w.step?"done":(i===w.step?"active":"");
    return `<div class="wizard-step ${cls}"><div class="num">${i<w.step?'<i class="fa-solid fa-check" style="font-size:9px;"></i>':i+1}</div><div class="lbl">${STEP_LABELS[s]}</div></div>${i<w.steps.length-1?'<div class="wizard-sep"></div>':''}`;
  }).join("");

  let body="";
  switch(w.steps[w.step]){
    case "batch": body=stepBatch(); break;
    case "capture": body=stepCapture(); break;
    case "quality": body=stepQuality(); break;
    case "analysis": body=stepAnalysis(); break;
    case "results": body=stepResults(); break;
    case "review": body=stepReview(); break;
    case "sampling": body=stepSampling(); break;
    case "size": body=stepSize(); break;
    case "result": body=stepResult(); break;
    case "heatmap": body=stepHeatmap(); break;
    case "uniformity": body=stepUniformity(); break;
    case "report": body=stepReport(); break;
    case "fingerprint": body=stepFingerprint(); break;
  }

  const isFirst=w.step===0, isLast=w.step===w.steps.length-1;
  return `
  <div class="page-head"><div><h1>New Assessment</h1><div class="sub">Batch ${w.batchForm.batchId} · ${w.batchForm.center.split(",")[0]}</div></div>
  <button class="btn btn-ghost" data-action="exit-wizard"><i class="fa-solid fa-xmark"></i> Exit</button></div>
  <div class="wizard-rail">${railHtml}</div>
  <div>${body}</div>
  `;
}

function wizardNav(prevLabel,nextLabel,opts){
  opts=opts||{};
  return `<div class="wizard-actions">
    <button class="btn btn-outline" data-action="wiz-back" ${S.wizard.step===0?'disabled':''}><i class="fa-solid fa-arrow-left"></i> ${prevLabel||'Back'}</button>
    <button class="btn btn-primary" data-action="wiz-next" ${opts.disabled?'disabled':''}>${nextLabel||'Continue'} <i class="fa-solid fa-arrow-right"></i></button>
  </div>`;
}

/* --- Step: Image Capture (real camera + real upload) --- */

      <button class="btn btn-accent" style="padding:12px 26px;font-size:14px;" data-action="start-ai-detection"><i class="fa-solid fa-wand-magic-sparkles"></i> Start AI Detection</button>
    </div>

  return `

/* --- Step: AI Analysis (progress) --- */
function stepAnalysis(){
  const sample = S.wizard.usingDemoSample ? SAMPLE_DETECTIONS[S.wizard.usingDemoSample] : null;
  const items = sample
    ? ["Loading inspection image","Detecting individual onions","Checking visible defects","Estimating onion size","Calculating batch metrics"]
    : ["Detecting onions","Segmenting individual onions","Detecting visible defects","Estimating size","Calculating confidence","Applying grading rules","Preparing report"];
  window.__afterRender = ()=>{
    if(S.wizard.analysisDone) return;
    let i=0;
    const rows=document.querySelectorAll(".analysis-row");
    const bar=document.getElementById("analysis-bar");
    const timer=setInterval(()=>{
      if(i<rows.length){
        rows[i].classList.remove("pending"); rows[i].classList.add("ok");
        rows[i].querySelector("i").className="fa-solid fa-circle-check";
        if(bar) bar.style.width=Math.round(((i+1)/rows.length)*100)+"%";
        i++;
      } else {
        clearInterval(timer);
        S.wizard.analysisDone=true;
        if(!S.wizard.usingDemoSample){
          // Only regenerate when this run started from the officer's own camera/upload photos —
          // fixed inspection samples already carry their predefined, non-random detections.
          S.wizard.onions = generateOnions(randi(70,100), Math.max(1,S.wizard.images.length));
          S.wizard.metrics = computeMetrics(S.wizard.onions);
        }
        const btn=document.getElementById("analysis-continue");
        if(btn){ btn.disabled=false; btn.innerHTML='View detection results <i class="fa-solid fa-arrow-right"></i>'; }
        toast("Analysis complete — "+S.wizard.onions.length+" onion(s) detected","success");
      }
    },550);
  };
  return `
  <div class="card" style="max-width:640px;margin:0 auto;">
    <div class="section-title" style="text-align:center;">${sample?'Analyzing onion batch…':'Analyzing batch images…'}</div>
    <div class="progressbar" style="margin:14px 0 22px;"><div id="analysis-bar" style="width:${S.wizard.analysisDone?100:0}%;"></div></div>
    <div class="checklist">
      ${items.map((it,i)=>`<div class="check-row ${S.wizard.analysisDone?'ok':'pending'} analysis-row"><i class="fa-solid ${S.wizard.analysisDone?'fa-circle-check':'fa-circle'}"></i> ${it}</div>`).join("")}
    </div>
    <div style="text-align:center;margin-top:22px;">
      <button class="btn btn-primary" id="analysis-continue" data-action="wiz-next" ${S.wizard.analysisDone?'':'disabled'}>
        ${S.wizard.analysisDone?'View detection results <i class="fa-solid fa-arrow-right"></i>':'Analyzing…'}
      </button>
    </div>
  </div>`;
}

/* --- shared: pile visual with dots (schematic fallback for historical seed batches) --- */
function pileDots(onions,opts){
  opts=opts||{};
  return onions.map(o=>{
    const color=DEFECT_COLOR[o.cls];
    const sel = S.wizard.selectedOnionId===o.id ? 'sel':'';
    return `<div class="onion-dot ${sel}" data-onion="${o.id}" title="${o.id} — ${o.cls} (${o.confidence}%)"
      style="left:${o.x}%;top:${o.y}%;width:${o.r*4}px;height:${o.r*4}px;background:${color};opacity:${o.confidence<75?0.65:0.92};"></div>`;
  }).join("");
}

/* --- shared: detection overlay on the ACTUAL uploaded/captured photo, with image tabs --- */
function realPhotoOverlay(images, onions, activeIdx, mode){
  mode = mode || "ai";
  if(!images || images.length===0){
    return mode==="original"
      ? `<div class="pile-wrap"><div class="pile-legend" style="position:static;display:inline-flex;">No original image available</div></div>`
      : `<div class="pile-wrap">${pileDots(onions)}<div class="pile-legend">${DEFECTS.map(d=>`<span><i style="background:${DEFECT_COLOR[d]}"></i>${d}</span>`).join("")}</div></div>`;
  }
  const idx = Math.min(activeIdx||0, images.length-1);
  const img = images[idx];
  const onImage = onions.filter(o=>(o.imageIndex||0)===idx);
  const tabs = images.length>1 ? `<div class="image-tabs">${images.map((im,i)=>`<button class="${i===idx?'active':''}" data-image-tab="${i}">Image ${i+1}${im.viewLabel?' · '+im.viewLabel:''}</button>`).join("")}</div>` : "";
  const toggle = `<div class="view-toggle">
      <button class="${mode==='original'?'active':''}" data-view-mode="original">Original</button>
      <button class="${mode==='ai'?'active':''}" data-view-mode="ai">AI Analysis</button>
    </div>`;
  if(mode==="original"){
    return `${toggle}${tabs}<div class="real-photo-wrap"><img src="${img.url}" alt="${img.name}"></div>`;
  }
  const markers = onImage.map(o=>{
    const color=DEFECT_COLOR[o.cls];
    const sel = S.wizard.selectedOnionId===o.id ? 'sel':'';
    if(o.box){
      // True bounding box — used for the fixed inspection-sample images, where coordinates
      // were hand-aligned to the actual supplied photograph.
      const region = o.defectRegion ? `<div class="defect-region ${sel}" data-onion="${o.id}" style="left:${o.defectRegion.x}%;top:${o.defectRegion.y}%;width:${o.defectRegion.width}%;height:${o.defectRegion.height}%;border-color:${color};">
          <span class="defect-region-label" style="background:${color};">${o.defectLabel||'Visible defect'}</span>
        </div>` : "";
      return `<div class="bbox ${sel}" data-onion="${o.id}" title="${o.id} — ${o.cls} (${o.confidence}%)"
        style="left:${o.box.x}%;top:${o.box.y}%;width:${o.box.width}%;height:${o.box.height}%;border-color:${color};">
        <span class="bbox-label" style="background:${color};">${o.cls} · ${o.confidence}%</span>
      </div>${region}`;
    }
    // Approximate circular marker — used for camera/upload photos where the AI backend
    // is simulated and only a point location (not a real bounding rectangle) is available.
    const showLabel = sel || o.cls!=="Healthy";
    const label = showLabel ? `<div class="onion-label" style="left:${o.x}%;top:${o.y}%;border-color:${color};color:${color};">${o.cls} · ${o.confidence}%</div>` : "";
    return `<div class="onion-dot ${sel}" data-onion="${o.id}" title="${o.id} — ${o.cls} (${o.confidence}%)"
      style="left:${o.x}%;top:${o.y}%;width:${o.r*4}px;height:${o.r*4}px;background:${color};opacity:${o.confidence<75?0.65:0.92};"></div>${label}`;
  }).join("");
  return `${toggle}${tabs}<div class="real-photo-wrap"><img src="${img.url}" alt="${img.name}">${markers}
    <div class="pile-legend">${DEFECTS.map(d=>`<span><i style="background:${DEFECT_COLOR[d]}"></i>${d}</span>`).join("")}</div>
  </div>`;
}

/* --- Step: AI Results / Annotated Image --- */
function stepResults(){
  const w=S.wizard;
  const filters=["All","Healthy","Damaged","Rotten","Sprouted","Undersized","Low Confidence"];
  let list = w.onions;
  if(w.resultsFilter==="Low Confidence") list=list.filter(o=>o.confidence<75);
  else if(w.resultsFilter!=="All") list=list.filter(o=>o.cls===w.resultsFilter);

  return `
  <div class="notice demo" style="margin-bottom:14px;"><i class="fa-solid fa-wand-magic-sparkles"></i><div>Detection markers are overlaid on your actual uploaded/captured image. AI observations are intended to support inspection and should be verified by authorized personnel.</div></div>
  <div class="two-col">
    <div class="card">
      <div class="card-head"><h3>Detected onions (${w.onions.length})</h3></div>
      ${realPhotoOverlay(w.images, w.onions, w.activeImageTab, w.viewMode)}
    </div>
    <div class="card" style="display:flex;flex-direction:column;">
      <div class="card-head"><h3>Filter results</h3></div>
      <div class="filterbar">${filters.map(f=>`<button class="chip ${w.resultsFilter===f?'active':''}" data-results-filter="${f}">${f}</button>`).join("")}</div>
      <div style="overflow-y:auto;max-height:360px;">

          <thead><tr><th>ID</th><th>Prediction</th><th>Confidence</th><th>Size</th><th>Status</th></tr></thead>

              <tr class="row-click" data-onion-row="${o.id}">

              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </div>
  ${wizardNav('Back to analysis','Continue to smart review')}`;
}

/* --- Onion detail modal --- */
function renderModal(){
  const w=S.wizard;
  if(!w.selectedOnionId) return "";
  const o=w.onions.find(x=>x.id===w.selectedOnionId);
  if(!o) return "";
  const explanations={
    Healthy:"Visible surface characteristics are consistent with the trained healthy-onion class. No damage, rot or sprouting detected in the visible region.",
    Damaged:"Visible surface region shows irregularities consistent with the trained damaged-onion class, such as bruising or skin breakage.",
    Rotten:"Visible surface region is consistent with the trained rotten-onion class, showing discoloration typical of decay.",
    Sprouted:"A visible shoot/sprout region is consistent with the trained sprouted-onion class.",
    Undersized:"Estimated diameter falls below the configured size threshold for standard grading."
  };
  const srcImg = w.images[o.imageIndex||0];
  let cropHtml;
  if(o.box && srcImg){
    const sx=100/o.box.width, sy=100/o.box.height;
    cropHtml = `<div style="aspect-ratio:1/1;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line);background:#20261F;">
      <img src="${srcImg.url}" style="position:absolute;left:${-(o.box.x*sx)}%;top:${-(o.box.y*sy)}%;width:${sx*100}%;height:${sy*100}%;max-width:none;object-fit:fill;">
      <div style="position:absolute;inset:0;border:3px solid ${DEFECT_COLOR[o.cls]};border-radius:10px;opacity:.85;pointer-events:none;"></div>
    </div>`;
  } else {
    cropHtml = `<div style="aspect-ratio:1/1;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line);
      background:radial-gradient(circle at 40% 35%, #E8C589, #C89A55 60%, #9C7538);">
      <div style="position:absolute;inset:0;border:3px solid ${DEFECT_COLOR[o.cls]};border-radius:10px;opacity:.85;"></div>
      ${o.cls!=="Healthy"?`<div style="position:absolute;left:30%;top:28%;width:40%;height:34%;border-radius:50%;background:${DEFECT_COLOR[o.cls]};opacity:.4;"></div>`:""}
    </div>`;
  }
  return `<div class="modal-overlay" id="onion-modal-overlay">
    <div class="modal wide">
      <div class="modal-head"><h3>${o.id} — detail &amp; explainability</h3><button class="close-x" id="onion-modal-close">✕</button></div>
      <div class="modal-body">
        <div class="two-col">
          <div>
            <div class="faint" style="margin-bottom:6px;">${o.box?'Cropped region':'Cropped region (simulated)'}</div>
            ${cropHtml}
          </div>
          <div>
            <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
              <span class="badge ${DEFECT_BADGE[o.cls]}" style="font-size:12.5px;">${o.cls}</span>
              <span class="badge ${o.confidence>=85?'high':o.confidence>=75?'medium':'low'}">${o.confidence}% confidence</span>
            </div>
            <div style="font-size:12.8px;line-height:1.6;color:var(--ink-soft);margin-bottom:12px;">${o.evidence||explanations[o.cls]} This is an AI prediction, not a laboratory or scientific determination.</div>
            <table style="margin-bottom:12px;">
              <tbody>
                <tr><td class="muted">Estimated size</td><td><b>${o.size} mm</b> (${o.sizeCat})</td></tr>
                <tr><td class="muted">Severity</td><td>${severityFor(o)}</td></tr>
                <tr><td class="muted">Review status</td><td>${o.verified?'<span class="badge high">Human-verified</span>':'<span class="badge neutral">'+o.status+'</span>'}</td></tr>
              </tbody>
            </table>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-primary sm" data-onion-action="confirm"><i class="fa-solid fa-check"></i> Confirm</button>
              <button class="btn btn-outline sm" data-onion-action="correct"><i class="fa-solid fa-pen"></i> Correct result</button>
              <button class="btn btn-outline sm" data-onion-action="reinspect"><i class="fa-solid fa-camera-rotate"></i> Request reinspection</button>
            </div>
            <div id="correct-panel"></div>
          </div>
        </div>
      </div>
    </div></div>`;
}

/* --- Step: Smart Review --- */
function stepReview(){
  const w=S.wizard;
  const low=w.onions.filter(o=>o.confidence<75);
  const med=w.onions.filter(o=>o.confidence>=75 && o.confidence<85);
  const high=w.onions.filter(o=>o.confidence>=85);
  return `
  <div class="notice ${low.length>0?'warn':'success'}" style="margin-bottom:16px;">
    <i class="fa-solid ${low.length>0?'fa-triangle-exclamation':'fa-circle-check'}"></i>
    <div><b>${low.length} of ${w.onions.length} onions require human review.</b> Focus verification effort on low-confidence predictions below.</div>
  </div>
  <div class="three-col" style="margin-bottom:16px;">
    <div class="card"><div class="lbl" style="color:var(--danger);font-weight:700;margin-bottom:6px;">Low confidence — mandatory review</div><div class="val" style="font-family:var(--font-head);font-size:24px;">${low.length}</div></div>
    <div class="card"><div class="lbl" style="color:#8A5E13;font-weight:700;margin-bottom:6px;">Medium confidence — recommended</div><div class="val" style="font-family:var(--font-head);font-size:24px;">${med.length}</div></div>
    <div class="card"><div class="lbl" style="color:var(--success);font-weight:700;margin-bottom:6px;">High confidence — AI result stands</div><div class="val" style="font-family:var(--font-head);font-size:24px;">${high.length}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Review queue</h3><button class="btn btn-outline sm" data-action="smart-reinspect"><i class="fa-solid fa-camera-rotate"></i> Smart reinspection</button></div>
    <table>
      <thead><tr><th>ID</th><th>Prediction</th><th>Confidence</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${low.concat(med).slice(0,30).map(o=>`
          <tr>
            <td><b>${o.id}</b></td>
            <td><span class="badge ${DEFECT_BADGE[o.cls]}">${o.cls}</span></td>
            <td>${o.confidence}%</td>
            <td>${o.verified?'<span class="badge high">Verified</span>':'<span class="badge '+(o.confidence<75?'low':'medium')+'">Needs review</span>'}</td>
            <td><button class="btn btn-ghost sm" data-onion-row="${o.id}">Review <i class="fa-solid fa-arrow-right"></i></button></td>
          </tr>`).join("")}
      </tbody>
    </table>
    ${(low.length+med.length)===0?`<div class="empty-state"><i class="fa-solid fa-circle-check"></i><div>No onions require review — all predictions are high confidence.</div></div>`:""}
  </div>
  ${wizardNav('Back to results','Continue to sampling check')}`;
}

/* --- Step: Intelligent Sampling --- */
function stepSampling(){
  const zones=["Top-left","Top-right","Center","Bottom-left","Bottom-right","Edge"];
  const flagged = zones[randi(0,zones.length-1)];
  return `
  <div class="notice demo" style="margin-bottom:16px;"><i class="fa-solid fa-lightbulb"></i><div>This is AI-assisted inspection guidance, not a certified statistical sampling procedure.</div></div>
  <div class="two-col">
    <div class="card">
      <div class="section-title">Sample coverage map</div>
      <div class="pile-wrap small" style="display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);">
        ${zones.map(z=>`<div style="border:1px dashed rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4);${z===flagged?'background:rgba(162,63,63,.35);':''}">${z}${z===flagged?' <i class="fa-solid fa-triangle-exclamation" style="margin-left:6px;"></i>':''}</div>`).join("")}
      </div>
    </div>
    <div class="card">
      <div class="section-title">Recommendation</div>
      <div class="notice warn"><i class="fa-solid fa-triangle-exclamation"></i><div>Current sample may not adequately represent the batch. Capture 1–2 additional images from the <b>${flagged}</b> section.</div></div>
      <button class="btn btn-outline" style="margin-top:14px;" data-action="add-sample"><i class="fa-solid fa-camera"></i> Capture additional sample</button>
      <div class="hr"></div>
      <div class="faint">Recommended sections: Left · Center · Right · Top layer · one representative random area.</div>

  </div>
  ${wizardNav('Back to review','Continue to size estimation')}`;
}

/* --- Step: Size Estimation --- */
function stepSize(){
  const w=S.wizard;
  const small=w.onions.filter(o=>o.sizeCat==="Small").length;
  const medium=w.onions.filter(o=>o.sizeCat==="Medium").length;

  window.__afterRender = ()=>{
    const ctx=document.getElementById("chart-size");
    drawChart(ctx,{type:"bar",data:{labels:["Small (<45mm)","Medium (45–55mm)","Large (>55mm)"],datasets:[{data:[small,medium,large],backgroundColor:["#2E6E8E","#3F7D4F","#B4831C"],borderRadius:6}]},
      options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:"#EAE8DC"}},x:{grid:{display:false}}}}});
  };
  return `
  <div class="two-col">
    <div class="card">
      <div class="section-title">Reference &amp; calibration</div>
      <div class="checklist">
        <div class="check-row ok"><i class="fa-solid fa-circle-check"></i> Reference marker detected: Yes</div>
        <div class="check-row ok"><i class="fa-solid fa-circle-check"></i> Calibration confidence: High</div>
      </div>
      <div class="hr"></div>
      <div class="section-title">Size distribution</div>
      <canvas id="chart-size" height="160"></canvas>
    </div>
    <div class="card">
      <div class="section-title">Summary</div>
      <table>
        <tbody>
          <tr><td class="muted">Estimated average diameter</td><td><b>${w.metrics.meanSize} mm</b></td></tr>
          <tr><td class="muted">Small (&lt;45mm)</td><td>${small} onions (${Math.round(small/n*100)}%)</td></tr>
          <tr><td class="muted">Medium (45–55mm)</td><td>${medium} onions (${Math.round(medium/n*100)}%)</td></tr>
          <tr><td class="muted">Large (&gt;55mm)</td><td>${large} onions (${Math.round(large/n*100)}%)</td></tr>
        </tbody>
      </table>
      <div class="notice demo" style="margin-top:14px;"><i class="fa-solid fa-sliders"></i><div>Size thresholds are configurable. Align with official criteria in <b>Settings → Assessment Configuration</b> before production deployment.</div></div>
    </div>
  </div>
  ${wizardNav('Back to sampling','Continue to batch result')}`;
}

/* --- Step: Batch Quality Result --- */
function stepResult(){
  const w=S.wizard, m=w.metrics;
  window.__afterRender = ()=>{
    const c1=document.getElementById("chart-donut");
    drawChart(c1,{type:"doughnut",data:{labels:DEFECTS,datasets:[{data:DEFECTS.map(d=>w.onions.filter(o=>o.cls===d).length),backgroundColor:DEFECTS.map(d=>DEFECT_COLOR[d]),borderWidth:0}]},
      options:{plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:11}}}},cutout:"62%"}});
    const c2=document.getElementById("chart-bar2");
    drawChart(c2,{type:"bar",data:{labels:["Damaged","Rotten","Sprouted","Undersized"],datasets:[{data:[m.damaged,m.rotten,m.sprouted,m.undersized],backgroundColor:["#B4831C","#A23F3F","#6A4A95","#2E6E8E"],borderRadius:6}]},
      options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:"#EAE8DC"}},x:{grid:{display:false}}}}});
  };
  const drivers=[];
  if(m.rejectedPct>0) drivers.push(`${m.rejectedPct}% visible rot/damage`);
  if(m.sprouted>0) drivers.push(`${Math.round(m.sprouted/m.n*100)}% sprouting`);
  if(m.undersized>0) drivers.push(`${Math.round(m.undersized/m.n*100)}% under-sized units`);
  return `
  <div class="grid kpi-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
    <div class="card kpi"><div class="lbl">Grade A % <span class="badge demo">configured rule</span></div><div class="val" style="color:var(--success);">${m.gradeAPct}%</div></div>
    <div class="card kpi"><div class="lbl">URS % <span class="badge demo">configured rule</span></div><div class="val" style="color:var(--info);">${m.ursPct}%</div></div>
    <div class="card kpi"><div class="lbl">Rejected %</div><div class="val" style="color:var(--danger);">${m.rejectedPct}%</div></div>
    <div class="card kpi"><div class="lbl">AI confidence (avg)</div><div class="val">${m.avgConf}%</div></div>
  </div>
  <div class="three-col" style="margin-bottom:16px;">
    <div class="card">
      <div class="card-head"><h3>Condition distribution</h3></div>
      <canvas id="chart-donut" height="180"></canvas>
    </div>
    <div class="card">
      <div class="card-head"><h3>Defect breakdown</h3></div>
      <canvas id="chart-bar2" height="180"></canvas>
    </div>
    <div class="card">
      <div class="card-head"><h3>AI Quality Indicator</h3></div>
      <div class="gauge-wrap" style="padding:14px 0;">${gaugeSvg(m.qualityScore)}<div class="gauge-num">${m.qualityScore}<span style="font-size:13px;color:var(--ink-faint);">/100</span></div><div class="faint">Supplementary AI indicator — does not replace official grading criteria.</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Why is this batch receiving this result?</h3></div>
    <p style="font-size:13px;line-height:1.7;">Out of <b>${m.n}</b> onions analyzed, <b>${m.healthy}</b> (${Math.round(m.healthy/m.n*100)}%) were classified healthy with no visible defects. ${drivers.length? 'The result is primarily affected by '+drivers.join(", ")+'.' : 'No significant visible defects were detected across the sampled images.'} ${m.n - S.wizard.onions.filter(o=>!o.verified).length>0?'':''} Human verification has confirmed <b>${w.onions.filter(o=>o.verified).length}</b> of the flagged low-confidence predictions so far.</p>
  </div>
  ${wizardNav('Back to size','View defect heatmap')}`;
}

function gaugeSvg(score){
  const r=46, circ=2*Math.PI*r, off=circ*(1-score/100);
  const color = score>=75?"#3F7D4F":score>=55?"#B4831C":"#A23F3F";
  return `<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="#EAE8DC" stroke-width="10"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
  </svg>`;
}

/* --- Step: Defect Heatmap --- */
function stepHeatmap(){
  const w=S.wizard;
  const filters=["All","Rotten","Damaged","Sprouted","Undersized"];
  let onions = w.heatmapFilter==="All"? w.onions.filter(o=>o.cls!=="Healthy") : w.onions.filter(o=>o.cls===w.heatmapFilter);
  const cols=5, rows=3; const grid=Array(rows*cols).fill(0);
  onions.forEach(o=>{
    const cx=Math.min(cols-1,Math.floor(o.x/100*cols));
    const cy=Math.min(rows-1,Math.floor(o.y/100*rows));
    grid[cy*cols+cx]++;
  });
  const maxV=Math.max(1,...grid);
  const cellNames=["top-left","top-center","top-right","","","center-left","center","center-right","","","bottom-left","bottom-center","bottom-right","",""];
  let peakIdx=0; grid.forEach((v,i)=>{ if(v>grid[peakIdx]) peakIdx=i; });
  const peakName = ["top-left","top-center-left","top-center-right","top-right","top-far-right",
                     "center-left","center","center","center-right","center-far-right",
                     "bottom-left","bottom-center-left","bottom-center-right","bottom-right","bottom-far-right"][peakIdx] || "center";

  const hasPhoto = w.images && w.images.length>0;
  const heatmapVisual = hasPhoto
    ? `<div class="real-photo-wrap"><img src="${w.images[Math.min(w.activeImageTab||0,w.images.length-1)].url}" alt="batch"><div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);">
        ${grid.map(v=>{ const alpha=v/maxV; return `<div style="background:rgba(162,63,63,${(alpha*0.6).toFixed(2)});border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.5);">${v>0?v:''}</div>`; }).join("")}
      </div></div>`
    : `<div class="pile-wrap" style="display:grid;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);">
        ${grid.map(v=>{ const alpha=v/maxV; return `<div style="background:rgba(162,63,63,${(alpha*0.75).toFixed(2)});border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.4);">${v>0?v:''}</div>`; }).join("")}
      </div>`;
  return `
  <div class="filterbar">${filters.map(f=>`<button class="chip ${w.heatmapFilter===f?'active':''}" data-heatmap-filter="${f}">${f}</button>`).join("")}</div>
  <div class="two-col">
    <div class="card">
      <div class="card-head"><h3>Defect concentration</h3></div>
      ${heatmapVisual}
    </div>
    <div class="card">
      <div class="section-title">Summary</div>
      <p style="font-size:12.8px;line-height:1.7;">Higher concentration of detected ${w.heatmapFilter==="All"?"defects":w.heatmapFilter.toLowerCase()+" onions"} in the <b>${peakName.replace(/-/g," ")}</b> region of the sampled batch image(s).</p>
      <div class="notice warn" style="margin-top:12px;"><i class="fa-solid fa-triangle-exclamation"></i><div>This heatmap represents visible AI detections only. It does not prove contamination or hidden internal defects.</div></div>
    </div>
  </div>
  ${wizardNav('Back to result','Continue to uniformity')}`;
}

/* --- Step: Batch Uniformity --- */
function stepUniformity(){
  const m=S.wizard.metrics;
  return `
  <div class="three-col" style="margin-bottom:16px;">
    <div class="card"><div class="section-title">Size consistency</div><div class="gauge-wrap">${gaugeSvg(m.sizeUniformity)}<div class="gauge-num">${m.sizeUniformity}</div></div></div>
    <div class="card"><div class="section-title">Appearance consistency</div><div class="gauge-wrap">${gaugeSvg(m.appearanceUniformity)}<div class="gauge-num">${m.appearanceUniformity}</div></div></div>
    <div class="card"><div class="section-title">Defect distribution consistency</div><div class="gauge-wrap">${gaugeSvg(m.defectDistUniformity)}<div class="gauge-num">${m.defectDistUniformity}</div></div></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>Overall uniformity score</h3></div>
    <div style="display:flex;align-items:center;gap:20px;">
      ${gaugeSvg(m.uniformity)}
      <div><div class="gauge-num" style="font-size:30px;">${m.uniformity}<span style="font-size:14px;color:var(--ink-faint);">/100</span></div>
      <p class="muted" style="font-size:12.8px;max-width:440px;margin-top:6px;">Higher score = more consistent batch across size, appearance and defect spread. This composite score uses a configurable weighting formula.</p></div>
    </div>
  </div>
  ${wizardNav('Back to heatmap','Generate digital report')}`;
}

function stepReport(){
  const w=S.wizard, m=w.metrics, f=w.batchForm;
  return `
  <div class="card" id="report-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:12px;">
      <div style="display:flex;gap:10px;align-items:center;">
        <div style="width:34px;height:34px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;color:#fff;">OG</div>
        <div><div style="font-family:var(--font-head);font-weight:700;">OnionGrade AI</div><div class="faint">Digital Quality Report</div></div>

/* --- Step: Digital Fingerprint --- */
function stepFingerprint(){
  const w=S.wizard;
  window.__afterRender = async ()=>{
    if(w.fingerprint) return;
    const payload = JSON.stringify({batchId:w.batchForm.batchId,metrics:w.metrics,onions:w.onions.length,ts:Date.now()});
    const hash = await sha256(payload);
    w.fingerprint = hash;
    const el=document.getElementById("fp-hash");
    if(el) el.textContent = hash;
    const status=document.getElementById("fp-status");
    if(status) status.innerHTML = '<i class="fa-solid fa-circle-check"></i> Integrity verified — report content matches stored fingerprint.';
  };
  return `
  <div class="card" style="max-width:640px;">
    <div class="section-title">Digital batch fingerprint</div>
    <div class="notice demo" style="margin-bottom:16px;"><i class="fa-solid fa-shield-halved"></i><div>OnionGrade AI records a real SHA-256 hash of the assessment metadata as a tamper-evident fingerprint on a permissioned verification ledger. No raw images are stored on a public ledger, and this is not a cryptocurrency feature.</div></div>
    <table><tbody>
      <tr><td class="muted">Assessment ID</td><td><b>AS-${pad(9000+randi(1,99),4)}</b></td></tr>
      <tr><td class="muted">Batch ID</td><td><b>${w.batchForm.batchId}</b></td></tr>
      <tr><td class="muted">Timestamp</td><td>${new Date().toLocaleString()}</td></tr>
      <tr><td class="muted">Previous assessment reference</td><td>${S.batches[0] ? S.batches[0].assessmentId : "—"}</td></tr>
      <tr><td class="muted">SHA-256 fingerprint</td><td style="word-break:break-all;font-family:monospace;font-size:11.5px;" id="fp-hash">computing…</td></tr>
    </tbody></table>
    <div class="notice success" style="margin-top:16px;" id="fp-status"><i class="fa-solid fa-spinner fa-spin"></i> Verifying integrity…</div>
  </div>
  <div class="wizard-actions">
    <button class="btn btn-outline" data-action="wiz-back"><i class="fa-solid fa-arrow-left"></i> Back to report</button>
    <button class="btn btn-accent" data-action="finish-wizard"><i class="fa-solid fa-check"></i> Finish &amp; save assessment</button>
  </div>`;
}

function renderReviewQueue(){
  const flagged=[];
  S.batches.forEach(b=>{
    b.onions.forEach(o=>{
      if(!o.verified && o.confidence<75){ flagged.push({batch:b, onion:o}); }
    });
  });
  flagged.sort((a,b)=>a.onion.confidence-b.onion.confidence);
  return `
  <div class="page-head"><div><h1>Review queue</h1><div class="sub">Low-confidence AI observations across all batches that need human verification.</div></div></div>
  <div class="notice ${flagged.length?'warn':'success'}" style="margin-bottom:16px;">
    <i class="fa-solid ${flagged.length?'fa-triangle-exclamation':'fa-circle-check'}"></i>
    <div><b>${flagged.length} onion(s) require review</b> across ${new Set(flagged.map(f=>f.batch.batchId)).size} batch(es).</div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>Batch</th><th>Onion</th><th>AI prediction</th><th>Confidence</th><th>Severity</th><th></th></tr></thead>
      <tbody>
        ${flagged.slice(0,60).map(f=>`
          <tr>
            <td><b>${f.batch.batchId}</b><div class="faint">${f.batch.center.split(",")[0]}</div></td>
            <td>${f.onion.id}</td>
            <td><span class="badge ${DEFECT_BADGE[f.onion.cls]}">${f.onion.cls}</span></td>
            <td>${f.onion.confidence}%</td>
            <td>${severityFor(f.onion)}</td>
            <td><button class="btn btn-ghost sm" data-open-batch="${f.batch.batchId}">Open batch <i class="fa-solid fa-arrow-right"></i></button></td>
          </tr>`).join("")}
      </tbody>
    </table>
    ${flagged.length===0?`<div class="empty-state"><i class="fa-solid fa-circle-check"></i><div>Nothing needs review right now.</div></div>`:""}
  </div>
  <p class="faint" style="margin-top:10px;">AI observations are intended to support inspection and should be verified by authorized personnel.</p>`;
}
function severityFor(o){
  if(o.severityOverride) return o.severityOverride;
  if(o.cls==="Healthy") return "—";
  if(o.confidence>=85) return "Severe";
  if(o.confidence>=70) return "Moderate";
  return "Mild";
}

function renderCompare(){
  const a=S.batches.find(b=>b.batchId===S.compare.a), b=S.batches.find(b=>b.batchId===S.compare.b);
  if(!a||!b) return `<div class="empty-state"><i class="fa-solid fa-code-compare"></i><div>Select two batches from Batch History to compare.</div></div>`;
  const rowsDef=[["Grade A %","gradeAPct","%"],["URS %","ursPct","%"],["Rejected %","rejectedPct","%"],["AI Quality Indicator","qualityScore",""],["Uniformity","uniformity",""]];
  const higherA = a.metrics.qualityScore>=b.metrics.qualityScore;
  const winner = higherA? a: b, loser = higherA? b: a;
  const reason = [];
  if(winner.metrics.rejectedPct<loser.metrics.rejectedPct) reason.push("lower visible rot/damage rates");
  if(winner.metrics.sprouted/winner.metrics.n < loser.metrics.sprouted/loser.metrics.n) reason.push("lower sprouting rates");
  if(winner.metrics.uniformity>loser.metrics.uniformity) reason.push("greater batch uniformity");
  return `
  <div class="page-head"><div><h1>Batch comparison</h1><div class="sub">${a.batchId} vs. ${b.batchId}</div></div>
  <button class="btn btn-outline" data-nav-to="history"><i class="fa-solid fa-arrow-left"></i> Back to history</button></div>
  <div class="card">
    <table>
      <thead><tr><th>Metric</th><th>${a.batchId}</th><th>${b.batchId}</th></tr></thead>
      <tbody>
        ${rowsDef.map(([lbl,k,suf])=>`<tr><td class="muted">${lbl}</td><td><b>${a.metrics[k]}${suf}</b></td><td><b>${b.metrics[k]}${suf}</b></td></tr>`).join("")}
      </tbody>
    </table>
  </div>
  <div class="card" style="margin-top:16px;">
    <div class="section-title">AI-generated comparison summary</div>
    <p style="font-size:13px;line-height:1.7;"><b>${winner.batchId}</b> has a higher quality score than <b>${loser.batchId}</b>${reason.length? ', primarily because of '+reason.join(" and ")+'.' : '.'}</p>
  </div>`;
}
